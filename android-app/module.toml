version = 2

[module]
type = "android-app"
name = "android-app"
languageLevel = "JAVA_17"
output = "build/classes"

[sourceSets.androidTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/androidTest/java", "src/androidTest/kotlin"]
resources = ["src/androidTest/resources"]

[sourceSets.debug]
scope = "IMPLEMENTATION"
aidl = ["src/debug/aidl"]
assets = ["src/debug/assets"]
java = ["src/debug/java", "src/debug/kotlin"]
jniLibs = ["src/debug/jniLibs"]
res = ["src/debug/res"]
resources = ["src/debug/resources"]

[sourceSets.main]
scope = "IMPLEMENTATION"
aidl = ["src/main/aidl"]
assets = ["src/main/assets"]
java = ["src/main/java", "src/main/kotlin"]
jniLibs = ["src/main/jniLibs"]
res = ["src/main/res"]
resources = ["src/main/resources"]

[sourceSets.release]
scope = "IMPLEMENTATION"
aidl = ["src/release/aidl"]
assets = ["src/release/assets"]
java = ["src/release/java", "src/release/kotlin"]
jniLibs = ["src/release/jniLibs"]
res = ["src/release/res"]
resources = ["src/release/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/java", "src/test/kotlin"]
resources = ["src/test/resources"]

[dependencies]
implementation = ["dev.rikka.shizuku:api:13.1.5", "dev.rikka.shizuku:provider:13.1.5", "dev.rikka.shizuku:aidl:13.1.5"]

[android]
namespace = "com.dsh.yaya"
compileSdk = 36
minSdk = 24
targetSdk = 28
manifest = "src/main/AndroidManifest.xml"
versionCode = 1
versionName = "1.0"
isApplication = true
manifestPlaceholders = []
buildTypes = [{ name = "release", debuggable = false, minifyEnabled = false, shrinkResources = false }]