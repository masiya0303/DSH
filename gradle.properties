# 项目级 Gradle 配置。
# 手机上内存有限，堆开太大反而容易被系统杀掉，所以这里比桌面项目保守一些。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# App 侧代码不依赖 androidx（见 LogShareProvider 的注释：只引 Shizuku 三个 AAR），
# 但打开这个开关不影响构建，且未来要引 androidx 时不用再改这里。
android.useAndroidX=true

# 每个库的 R 类只含自身资源，减小方法数。
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true
